@if (visible()) {
  <div class="cookie-banner card">
    <p>
      We use a cookie to keep you logged in and remember your cart. By using this site you
      agree to that — see nothing else is tracked.
    </p>
    <div class="cookie-actions">
      <button class="btn btn-outline btn-sm" (click)="decline()">Decline</button>
      <button class="btn btn-sm" (click)="accept()">Accept</button>
    </div>
  </div>
}
